<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mandaloun</title>
<style>
  :root {
    --paper: #f3eee2;
    --ink: #2b2a22;
    --screens: 6; /* how many screens tall the scroll is */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--paper); color: var(--ink); }

  /* Scroll track: this is what gives the page its height */
  .track { height: calc(var(--screens) * 100vh); height: calc(var(--screens) * 100svh); position: relative; }

  /* Pinned stage: stays on screen while the track scrolls */
  .stage {
    position: sticky; top: 0;
    height: 100vh; height: 100svh;
    width: 100%;
    overflow: hidden;
    background: var(--paper);
  }
  /* The tree is bigger than the screen; JS sizes it and pans it tip → base */
  .tree {
    position: absolute; top: 0; left: 50%;
    will-change: transform;
  }
  .tree img {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    visibility: hidden;
    user-select: none; -webkit-user-drag: none;
  }
  .tree img.on { visibility: visible; }

  /* Loading state */
  .loader {
    position: fixed; inset: 0; z-index: 10;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1.25rem;
    background: var(--paper);
    transition: opacity .6s ease, visibility .6s;
    font-family: Georgia, 'Times New Roman', serif;
  }
  .loader.done { opacity: 0; visibility: hidden; }
  .loader .name { font-size: clamp(1.5rem, 5vw, 2.5rem); letter-spacing: .3em; text-transform: uppercase; }
  .loader .bar { width: min(240px, 60vw); height: 2px; background: rgba(43,42,34,.15); }
  .loader .bar i { display: block; height: 100%; width: 0; background: #3d5340; transition: width .2s linear; }
  .loader .pct { font-size: .85rem; letter-spacing: .2em; font-variant-numeric: tabular-nums; }

  /* Lock scrolling until loaded */
  body.loading { overflow: hidden; }
</style>
</head>
<body class="loading">

<div class="loader" id="loader" role="status" aria-live="polite">
  <div class="name">Mandaloun</div>
  <div class="bar"><i id="bar"></i></div>
  <div class="pct" id="pct">0%</div>
</div>

<main class="track" id="track">
  <div class="stage" aria-label="Cedar tree rotating as you scroll">
    <div class="tree" id="stage"></div>
  </div>
</main>

<script>
(() => {
  const FRAMES = 14;                        // 000 … 013
  const ASPECT = 3508 / 2481;               // frame width / height
  const ZOOM = 2;                           // tree height as a multiple of the screen height (bigger = more travel, more side crop)
  const TIP = 0.03, BASE = 0.97;            // where the tip / base sit inside the frame (fraction of height)
  const src = i => `cedar/${String(i).padStart(3, '0')}.png`;

  const stage = document.getElementById('stage');
  const track = document.getElementById('track');
  const loader = document.getElementById('loader');
  const bar = document.getElementById('bar');
  const pct = document.getElementById('pct');

  const imgs = [];
  let loaded = 0, current = -1;

  function finish() {
    loader.classList.add('done');
    document.body.classList.remove('loading');
    update();
  }

  function onFrame() {
    loaded++;
    const p = Math.round(loaded / FRAMES * 100);
    bar.style.width = p + '%';
    pct.textContent = p + '%';
    if (loaded === FRAMES) setTimeout(finish, 300);
  }

  // Build and preload every frame (errors still count so the page never hangs)
  for (let i = 0; i < FRAMES; i++) {
    const img = new Image();
    img.alt = '';
    img.decoding = 'async';
    img.draggable = false;
    img.onload = () => { (img.decode ? img.decode().catch(() => {}) : Promise.resolve()).then(onFrame); };
    img.onerror = onFrame;
    img.src = src(i);
    stage.appendChild(img);
    imgs.push(img);
  }
  imgs[0].classList.add('on');
  current = 0;

  // Size the tree larger than the screen
  let H = 0;
  function layout() {
    H = window.innerHeight * ZOOM;
    stage.style.height = H + 'px';
    stage.style.width = H * ASPECT + 'px';
    stage.style.marginLeft = -(H * ASPECT) / 2 + 'px';
    update();
  }

  // Scroll progress (0 → 1) drives both the vertical travel and the frame
  function update() {
    const max = track.offsetHeight - window.innerHeight;
    const p = max > 0 ? Math.min(1, Math.max(0, window.scrollY / max)) : 0;

    // Travel: tip at the top of the screen at p=0, base at the bottom at p=1
    const y0 = -TIP * H;
    const y1 = window.innerHeight - BASE * H;
    stage.style.transform = `translate3d(0, ${y0 + p * (y1 - y0)}px, 0)`;

    const idx = Math.min(FRAMES - 1, Math.floor(p * FRAMES));
    if (idx === current) return;
    imgs[current].classList.remove('on');
    imgs[idx].classList.add('on');
    current = idx;
  }

  let ticking = false;
  window.addEventListener('scroll', () => {
    if (ticking) return;
    ticking = true;
    requestAnimationFrame(() => { update(); ticking = false; });
  }, { passive: true });
  window.addEventListener('resize', layout);
  layout();
})();
</script>
</body>
</html>
